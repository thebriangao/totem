<rect class="p" x="53.2" y="166" width="8.3" height="10" fill="rgb(183,211,242)"/><rect class="p" x="61" y="166" width="8.3" height="10" fill="rgb(183,211,242)"/><rect class="p" x="68.8" y="166" width="8.3" height="10" fill="rgb(183,211,242)"/><rect class="p" x="68.8" y="175.5" width="8.3" height="10" fill="rgb(183,211,242)"/><rect class="p" x="76.6" y="166" width="8.3" height="10" fill="rgb(183,211,242)"/><rect class="p" x="76.6" y="175.5" width="8.3" height="10" fill="rgb(183,211,242)"/><rect class="p" x="84.4" y="166" width="8.3" height="10" fill="rgb(183,211,242)"/><rect class="p" x="92.2" y="166" width="8.3" height="10" fill="rgb(183,211,242)"/></g><g class="r6"><text y="217.68"><tspan x="22" fill="#8591a0">[1/3]</tspan><tspan x="68.8" fill="#f3f6f9" font-weight="700">Prerequisites</tspan></text></g><g class="r7"><text y="236.68"><tspan x="22" fill="rgb(136,225,208)">✓</tspan><tspan x="29.8"> Node.js 24.3.0</tspan></text></g><g class="r8"><text y="255.68"><tspan x="22" fill="rgb(136,225,208)">✓</tspan><tspan x="29.8"> Dependencies installed</tspan></text></g><g class="r9"><text y="274.68"><tspan x="22" fill="rgb(136,225,208)">✓</tspan><tspan x="29.8"> Server built</tspan></text></g><g class="r11"><text y="312.68"><tspan x="22" fill="#8591a0">[2/3]</tspan><tspan x="68.8" fill="#f3f6f9" font-weight="700">WHOOP login</tspan></text></g><g class="r12"><text y="331.68"><tspan x="22">A Google Chrome window opens on WHOOP's site with a temporary profile. Log in</tspan></text></g><g class="r13"><text y="350.68"><tspan x="22">there. totem never sees what you type: it waits for WHOOP's session cookies,</tspan></text></g><g class="r14"><text y="369.68"><tspan x="22">then closes the window and deletes the profile.</tspan></text></g><g class="r15"><text y="388.68"><tspan x="22" fill="#8591a0">•</tspan><tspan x="37.6" fill="#8591a0">Waiting for you to log in in the browser</tspan><tspan x="349.6" fill="#8591a0">…</tspan></text></g><g class="r16"><text y="407.68"><tspan x="22" fill="rgb(136,225,208)">✓</tspan><tspan x="29.8"> Logged in to WHOOP</tspan><tspan x="185.8" fill="#8591a0">(user 1234567)</tspan></text></g><g class="r17"><text y="426.68"><tspan x="22" fill="rgb(136,225,208)">✓</tspan><tspan x="29.8"> Login saved</tspan><tspan x="131.2" fill="#8591a0">(~/.config/totem/tokens.json)</tspan></text></g><g class="r19"><text y="464.68"><tspan x="22" fill="#8591a0">[3/3]</tspan><tspan x="68.8" fill="#f3f6f9" font-weight="700">Connect your apps</tspan></text></g><g class="r21"><text y="502.68"><tspan x="22">Found on this computer: Claude Desktop, Claude Code, ChatGPT, OpenCode and</tspan></text></g><g class="r22"><text y="521.68"><tspan x="22">Antigravity.</tspan></text></g><g class="r23"><text y="540.68"><tspan x="22" fill="rgb(113,201,250)">?</tspan><tspan x="37.6" fill="#f3f6f9" font-weight="700">Add totem to all 5?</tspan><tspan x="193.6" fill="#8591a0">(Y/n)</tspan></text></g><g class="r24"><text y="559.68"><tspan x="22" fill="rgb(136,225,208)">✓</tspan><tspan x="29.8"> Added the whoop server to Claude Desktop</tspan></text></g><g class="r25"><text y="578.68"><tspan x="37.6" fill="#8591a0">~/Library/Application Support/Claude/claude_desktop_config.json</tspan></text></g><g class="r26"><text y="597.68"><tspan x="22" fill="rgb(136,225,208)">✓</tspan><tspan x="29.8"> Added the whoop server to Claude Code</tspan><tspan x="334" fill="#8591a0">(claude mcp add)</tspan></text></g><g class="r27"><text y="616.68"><tspan x="22" fill="rgb(136,225,208)">✓</tspan><tspan x="29.8"> Added the whoop server to ChatGPT</tspan><tspan x="302.8" fill="#8591a0">(codex mcp add)</tspan></text></g><g class="r28"><text y="635.68"><tspan x="22" fill="rgb(136,225,208)">✓</tspan><tspan x="29.8"> Added the whoop server to OpenCode</tspan><tspan x="310.6" fill="#8591a0">(~/.config/opencode/opencode.json)</tspan></text></g><g class="r29"><text y="654.68"><tspan x="22" fill="rgb(136,225,208)">✓</tspan><tspan x="29.8"> Added the whoop server to Antigravity</tspan><tspan x="334" fill="#8591a0">(~/.gemini/config/mcp_config.json)</tspan></text></g><g class="r31"><text y="692.68"><tspan x="22" fill="#f3f6f9" font-weight="700">Next</tspan></text></g><g class="r32"><text y="711.68"><tspan x="37.6" fill="rgb(113,201,250)">1.</tspan><tspan x="53.2"> Quit and reopen Claude Desktop.</tspan></text></g><g class="r33"><text y="730.68"><tspan x="37.6" fill="rgb(113,201,250)">2.</tspan><tspan x="53.2"> Start a new Claude Code session.</tspan></text></g><g class="r34"><text y="749.68"><tspan x="37.6" fill="rgb(113,201,250)">3.</tspan><tspan x="53.2"> Restart ChatGPT, or start a new Codex session.</tspan></text></g><g class="r35"><text y="768.68"><tspan x="37.6" fill="rgb(113,201,250)">4.</tspan><tspan x="53.2"> Start a new OpenCode session.</tspan></text></g><g class="r36"><text y="787.68"><tspan x="37.6" fill="rgb(113,201,250)">5.</tspan><tspan x="53.2"> In Antigravity, type /mcp and check whoop is connected.</tspan></text></g><g class="r37"><text y="806.68"><tspan x="37.6" fill="rgb(113,201,250)">6.</tspan><tspan x="53.2"> Ask it: "How did I sleep last night?"</tspan></text></g><g class="r39"><text y="844.68"><tspan x="37.6">Connect another app:</tspan><tspan x="201.4" fill="rgb(114,222,228)">totem connect</tspan></text></g>
</g></g>
